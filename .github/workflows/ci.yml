name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nowusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nowusa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: file:./dev.sqlite
      DIRECT_URL: postgresql://test:test@localhost:5432/nowusa_test
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: SQLite tests
        run: npm test
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nowusa_test
      - name: PostgreSQL tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nowusa_test
      - name: Standard server build
        run: npm run build
      - name: Vercel build
        run: npm run build:vercel
        env:
          VERCEL: '1'
          DATABASE_URL: postgresql://test:test@localhost:5432/nowusa_test
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_API_SECRET: ci-placeholder
          SHOPIFY_APP_URL: https://ci.example
          ALLOWED_SHOP: iyhxfe-mw.myshopify.com
