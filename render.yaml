# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: nowusa
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        value: 15dad9f47a0fae6a2d46cf6c02946492
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: ALLOWED_SHOP
        value: iyhxfe-mw.myshopify.com
      - key: SCOPES
        value: read_products,write_products,read_files,write_files
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
